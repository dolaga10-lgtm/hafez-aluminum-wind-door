<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#1b110a;--card:#2a1b10;--line:#6b5636;--gold:#d9b866;--tx:#f3e6c4;--mu:#a89874}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none}
#app{display:none;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:#3b2415;border-bottom:1px solid var(--line)}
header b{flex:1;font-weight:900;font-size:16px;color:var(--gold)}
main{flex:1;overflow:auto;padding:12px 12px max(20px,env(safe-area-inset-bottom))}
.scr{display:none;max-width:640px;margin:0 auto}.scr.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px;color:var(--gold)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1b110a;color:#fff;font:700 15px Cairo,sans-serif;margin-bottom:8px}
label{font-size:12px;color:var(--mu);display:block}
button{font:900 14px Cairo,sans-serif;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--gold)}
button.p{background:var(--gold);color:#2a1b10;border:0}button.d{color:#fca5a5}
button:disabled{opacity:.5}
.r{display:flex;gap:6px;align-items:center}.r>*{flex:1;min-width:0}.r>button{flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it .t{flex:1;font-size:13px}.it small{display:block;color:var(--mu)}
.sy{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}summary{color:var(--gold);cursor:pointer;margin:6px 0;font-weight:700}
.tot{font-size:20px;font-weight:900;color:var(--gold);text-align:center;margin:8px 0}
#pdfBox{position:fixed;left:-9999px;top:0;width:794px;background:#fff;color:#000;font-family:Cairo,sans-serif;direction:rtl;padding:24px;font-size:13px}
#pdfBox h2{margin:0 0 4px;font-size:20px}#pdfBox h4{margin:14px 0 4px;background:#eee;padding:4px 8px}
#pdfBox table{width:100%;border-collapse:collapse}#pdfBox td,#pdfBox th{border:1px solid #888;padding:4px 6px;text-align:center}
    #hzSplash{position:fixed;inset:0;z-index:9998;background:#1b110a;overflow:hidden;transition:opacity .8s}
    #hzSplash .im{position:absolute;inset:0;background:url(splash.jpg) center/cover no-repeat;transform:scale(.15);opacity:0;transition:filter 1s}
    #hzSplash.go .im{animation:hzZoom 2s cubic-bezier(.25,.6,.25,1) forwards}
    @keyframes hzZoom{0%{transform:scale(.7);opacity:0}30%{opacity:1}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
    #hzSplash .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,214,120,.55),rgba(255,214,120,0) 55%);opacity:0}
    #hzSplash.go .glow{animation:hzGlow 2.2s ease-out .6s forwards}
    @keyframes hzGlow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.18;transform:scale(1.15)}}
    #hzSplash .shine{position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,238,180,.6),transparent);transform:translateX(-160%) skewX(-18deg);opacity:0}
    #hzSplash.go .shine{animation:hzShine 1.1s ease-in-out .95s forwards}
    @keyframes hzShine{0%{opacity:1;transform:translateX(-160%) skewX(-18deg)}100%{opacity:1;transform:translateX(420%) skewX(-18deg)}}
    #hzSplash .sp{position:absolute;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,220,120,.9);opacity:0;animation:hzSp 1.7s ease-out forwards}
    @keyframes hzSp{0%{opacity:0;transform:translateY(0) scale(0)}30%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.3)}}
    #hzSplash.bg .im{filter:brightness(.45)}
    #hzSplash.out{opacity:0;pointer-events:none}
    #hzTag{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 7%);padding:0 18px;text-align:center;direction:rtl;font-family:Cairo,sans-serif;color:#f3e6c4;text-shadow:0 2px 10px rgba(0,0,0,.8)}
    #hzTag>*{display:block;opacity:0}
    #hzTag b{font-size:24px;font-weight:900;color:#e8c872;margin-bottom:6px}
    #hzTag span{font-size:14px;font-weight:700;line-height:1.8}
    #hzSplash.bg #hzTag>*{animation:hzUp .8s ease-out forwards}
    #hzSplash.bg #hzTag>*:nth-child(2){animation-delay:.45s}
    #hzSplash.bg #hzTag>*:nth-child(3){animation-delay:.85s}
    @keyframes hzUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
    #hzLogin{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;direction:rtl;font-family:Cairo,sans-serif}
    #hzLogin .box{width:100%;max-width:340px;background:rgba(27,17,10,.82);border:1px solid #c9b27a;border-radius:20px;padding:20px;color:#f3e6c4;backdrop-filter:blur(6px)}
    #hzLogin h3{margin:0 0 14px;text-align:center;font-weight:900;font-size:18px}
    #hzLogin input[type=text],#hzLogin input[type=password]{width:100%;margin-bottom:10px;padding:11px 12px;border-radius:12px;border:1px solid #6b5636;background:#2a1b10;color:#fff;font:700 15px Cairo,sans-serif;text-align:center}
    #hzLogin button{width:100%;padding:11px;border-radius:12px;border:0;font:900 15px Cairo,sans-serif;background:#d9b866;color:#2a1b10}
    #hzErr{display:none;margin:8px 0 0;color:#fca5a5;font:700 12px Cairo,sans-serif;text-align:center}
    #hzInstall{display:none;margin-top:8px;background:transparent!important;color:#d9b866!important;border:1px solid #6b5636!important}
</style>
</head>
<body>
<div id="hzSplash"><div class="im"></div><div class="glow"></div><div class="shine"></div><div id="hzSpk"></div><div id="hzTag"><b>خبرة منذ سنة 1980</b><span>في تصنيع المطابخ الألومنيوم والخشب</span><span>وجميع أعمال الأخشاب والمشاريع والواجهات الزجاجية</span></div></div>
<div id="hzLogin"><div class="box">

  <input id="hzP" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <label style="display:flex;gap:8px;align-items:center;margin:2px 0 10px;font:700 13px Cairo,sans-serif"><input id="hzR" type="checkbox" checked> تذكرني</label>
  <button id="hzGo" type="button">دخول ✨</button>
  <button id="hzInstall" type="button">📲 تثبيت التطبيق</button>

</div></div>

<div id="app">
<header><button id="bk">›</button><b id="ttl"></b><button id="lo" class="d">خروج</button></header>
<main>

  <div class="card"><h3>القطاعات (سعر المتر المربع + خصومات القص)</h3><div id="pS"></div><button class="p" id="aS" style="width:100%;margin-top:8px">+ إضافة قطاع جديد بخصوماته</button></div>
  <div class="card"><h3>أسعار الزجاج (للمتر المربع)</h3><div id="pG"></div><button id="aG">+ نوع زجاج</button></div>
  <div class="card"><h3>طول العود (سم)</h3><div id="pP"></div></div>
  <button class="p" style="width:100%" id="toCl">حفظ والتالي: العملاء ›</button>
</section>
<section class="scr" id="s-client">
  <div class="card"><h3>عميل جديد</h3><input id="cn" placeholder="اسم العميل"><button class="p" style="width:100%" id="cGo">بدء إدخال المقاسات</button></div>
  <div class="card"><h3>العملاء المحفوظين</h3><div id="cl"></div></div>
</section>
<section class="scr" id="s-win">
  <div class="card"><h3 id="wh"></h3>
    <label>نوع الشباك</label><select id="wt"></select>
    <div class="g2"><div><label>النظام</label><select id="ws"></select></div><div><label>الزجاج</label><select id="wg"></select></div></div>
    <div class="g2"><div><label>العرض (سم)</label><input id="ww" type="number" inputmode="decimal"></div><div><label>الارتفاع (سم)</label><input id="wh2" type="number" inputmode="decimal"></div></div>
    <label>العدد</label><input id="wq" type="number" inputmode="numeric" value="1" min="1">
    <button class="p" style="width:100%" id="wAdd">إضافة الشباك</button></div>
  <div class="card"><h3>شبابيك العميل</h3><div id="wl"></div><div class="tot" id="wt2"></div>
    <button class="p" style="width:100%" id="toPdf">إنهاء وإنشاء PDF ›</button></div>
</section>
<section class="scr" id="s-pdf">
  <div class="card"><h3>الخصم</h3><div class="r"><input id="dv" type="number" inputmode="decimal" placeholder="0"><select id="dt"><option value="v">قيمة</option><option value="p">%</option></select></div>
    <div class="tot" id="pt"></div></div>
  <button class="p" style="width:100%;margin-bottom:8px" id="pW">ملف الورشة (خامات + زجاج + تجميع + تقطيع)</button>
  <button class="p" style="width:100%" id="pQ">عرض سعر للعميل</button>
</section>
</main></div>
<div id="pdfBox"></div>
<script>
(function(){
  var API='https://dola-license-server.dolaga10.workers.dev/login',KEY='dolaga1122wwqq';
  var SEND_DEVICE_ID=false; // false = الموبايل يبعت hwid فاضي. لو السيرفر بيرفض، غيّرها true أو عدّل الـ Worker
  var LS=window.localStorage,$=function(i){return document.getElementById(i)};
  function g(k){try{return LS.getItem(k)||''}catch(e){return ''}}
  function p(k,v){try{LS.setItem(k,v)}catch(e){}}
  function d(k){try{LS.removeItem(k)}catch(e){}}
  function devId(){var x=g('hz_dev');if(!x){x='and-'+Math.random().toString(36).slice(2)+Date.now().toString(36);p('hz_dev',x)}return x}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

  // ---- منع تكبير الصفحة بالصباعين ----
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
  document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault()});

  // ---- منع إطفاء الشاشة ----
  var wl=null;
  function lock(){if(!navigator.wakeLock||document.visibilityState!=='visible')return;navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}
  lock();document.addEventListener('visibilitychange',lock);document.addEventListener('touchstart',function(){if(!wl)lock()},{passive:true});

  // ---- زر تثبيت التطبيق ----
  var ip=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ip=e;$('hzInstall').style.display='block'});
  $('hzInstall').onclick=function(){if(ip){ip.prompt();ip=null;$('hzInstall').style.display='none'}};


  // ---- مؤثرات الافتتاحية: لمعان + صوت ----
  window.__hzFx=function(){
    var h=$('hzSpk');if(h){for(var k=0;k<18;k++){var e=document.createElement('span'),z=3+Math.random()*4;e.className='sp';
      e.style.cssText='left:'+(10+Math.random()*80)+'%;top:'+(25+Math.random()*50)+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(0.8+Math.random()*1.4).toFixed(2)+'s';h.appendChild(e)}}
    try{
      var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var c=new A(),t=c.currentTime+.05;
      var nb=c.createBuffer(1,c.sampleRate*1.2,c.sampleRate),d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      var ns=c.createBufferSource();ns.buffer=nb;var f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
      f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3200,t+.9);

      ns.connect(f);f.connect(wg);wg.connect(c.destination);ns.start(t);
      [523.25,659.25,783.99,1046.5].forEach(function(fr,k){
        var st=t+.85+k*.11;
        [['sine',fr,.2,1.4],['triangle',fr*2,.05,1]].forEach(function(q){
          var o=c.createOscillator(),g=c.createGain();o.type=q[0];o.frequency.value=q[1];
          g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(q[2],st+.02);g.gain.exponentialRampToValueAtTime(.001,st+q[3]);
          o.connect(g);g.connect(c.destination);o.start(st);o.stop(st+q[3]+.1)});
      });
      if(c.state==='suspended'){c.resume&&c.resume();var r=function(){c.resume&&c.resume();document.removeEventListener('touchstart',r);document.removeEventListener('click',r)};
        document.addEventListener('touchstart',r);document.addEventListener('click',r)}
    }catch(e){}
  };

  // ---- الدخول ----
  function err(m){var e=$('hzErr');e.textContent=m;e.style.display=m?'block':'none'}
  async function call(u,pw){
    var c=new AbortController(),t=setTimeout(function(){c.abort()},10000);
    try{
      var r=await fetch(API,{method:'POST',cache:'no-store',signal:c.signal,headers:{'Content-Type':'application/json','X-License-Key':KEY},body:JSON.stringify({username:u,password:pw,hwid:SEND_DEVICE_ID?devId():''})});
      if(!r.ok&&[401,403,404,410].indexOf(r.status)<0)throw new Error('http');
      return await r.json();
    }finally{clearTimeout(t)}
  }
  function enter(res,u){
    p('hz_sess',JSON.stringify({u:u,expire:res&&res.expire||''}));
    $('hzLogin').style.display='none';$('hzSplash').classList.add('out');
    setTimeout(function(){var s=$('hzSplash');if(s)s.remove()},900);
    setTimeout(function(){window.hzEntered&&window.hzEntered()},700);
  }
  function showLogin(){$('hzLogin').style.display='flex'}
  function reason(res){
    if(res&&res.reason==='expired')return 'عفواً، انتهت فترة صلاحية هذا الاشتراك!';

  var pim=new Image();pim.onload=pim.onerror=begin;pim.src=SPL;setTimeout(begin,2500);


})();
</script>
<script>

function drawPrices(){
  const gs={};D.prices.forEach((p,i)=>{if(p.t==='s')(gs[p.grp||'مخصص']=gs[p.grp||'مخصص']||[]).push(i)});
  $('pS').innerHTML=Object.keys(gs).map(g=>`<details ${g==='عام'||gs[g].includes(OPEN)?'open':''}><summary>${esc(g)} (${gs[g].length})</summary>${gs[g].map(i=>{const p=D.prices[i];return `<div class="sy"><div class="r"><input data-pn="${i}" value="${esc(p.n)}"><input data-pv="${i}" type="number" inputmode="decimal" value="${p.v}" placeholder="سعر م²"><button class="d" data-pd="${i}">×</button></div><details ${i===OPEN?'open':''}><summary>الخصومات (سم)</summary><div class="g2">${Object.keys(PL).map(k=>`<div><label>${PL[k]}</label><input data-sp="${i}|${k}" type="number" inputmode="decimal" value="${p.par[k]}"></div>`).join('')}</div></details></div>`}).join('')}</details>`).join('');
  $('pG').innerHTML=D.prices.map((p,i)=>p.t!=='g'?'':`<div class="r"><input data-pn="${i}" value="${esc(p.n)}"><input data-pv="${i}" type="number" inputmode="decimal" value="${p.v}"><button class="d" data-pd="${i}">×</button></div>`).join('');
  $('pP').innerHTML=`<label>طول العود للتقطيع</label><input data-bar type="number" inputmode="decimal" value="${D.par.bar}">`;
}
$('aS').onclick=()=>{const n=(prompt('اسم القطاع الجديد')||'').trim();if(!n)return;const g=(prompt('المجموعة (اختياري)','مخصص')||'مخصص').trim()||'مخصص';D.prices.splice(D.prices.findIndex(p=>p.t==='g'),0,mkS(n,g));OPEN=D.prices.findIndex(p=>p.n===n&&p.t==='s');save();drawPrices()};
$('aG').onclick=()=>{D.prices.push({t:'g',n:'زجاج جديد',v:0});save();drawPrices()};
$('toCl').onclick=()=>{save();drawClients();go('client','العملاء')};

/* clients */
function drawClients(){
  $('cl').innerHTML=D.clients.length?D.clients.map(c=>`<div class="it"><div class="t">${esc(c.name)}<small>${c.wins.length} شباك — ${new Date(c.at).toLocaleDateString('ar-EG')}</small></div><button data-co="${c.id}">فتح</button><button data-cr="${c.id}">اسم</button><button class="d" data-cd="${c.id}">حذف</button></div>`).join(''):'<small style="color:var(--mu)">لا يوجد عملاء بعد.</small>';
}
$('cGo').onclick=()=>{const n=$('cn').value.trim();if(!n){alert('اكتب اسم العميل');return}
  const c={id:Date.now(),name:n,at:Date.now(),wins:[],dv:0,dt:'v'};D.clients.unshift(c);D.cur=c.id;save();$('cn').value='';openWin()};
function openWin(){
  const fill=(id,t)=>$(id).innerHTML=D.prices.filter(p=>p.t===t).map(p=>`<option>${esc(p.n)}</option>`).join('');
  $('wt').innerHTML=Object.keys(T).map(k=>`<option value="${k}">${T[k].n}</option>`).join('');$('ws').innerHTML=sysOpts();fill('wg','g');
  editIdx=-1;$('wAdd').textContent='إضافة الشباك';drawWins();go('win','المقاسات')}

/* windows */
function wPrice(w){const area=w.W*w.H/10000;return{area,rate:rate(w.s)+rate(w.g),price:area*(rate(w.s)+rate(w.g))*w.q}}
const sumC=c=>c.wins.reduce((s,w)=>s+wPrice(w).price,0);
function drawWins(){
  const c=cur();$('wh').textContent='العميل: '+c.name;
  $('wl').innerHTML=c.wins.length?c.wins.map((w,i)=>`<div class="it"><div class="t">${i+1}. ${T[w.t].n} — ${w.W}×${w.H} سم × ${w.q}<small>${esc(w.s)} / ${esc(w.g)} — ${f1(wPrice(w).price)}</small></div><button data-wu="${i}">▲</button><button data-wdn="${i}">▼</button><button data-we="${i}">✎</button><button class="d" data-wx="${i}">×</button></div>`).join(''):'<small style="color:var(--mu)">لم تتم إضافة شبابيك.</small>';
  $('wt2').textContent='الإجمالي: '+f1(sumC(c));
}
$('wAdd').onclick=()=>{const c=cur(),W=num($('ww').value),H=num($('wh2').value),q=Math.max(1,parseInt($('wq').value)||1);
  if(!(W>0&&H>0)){alert('اكتب العرض والارتفاع');return}
  const w={t:$('wt').value,s:$('ws').value,g:$('wg').value,W,H,q};
  if(editIdx>=0){c.wins[editIdx]=w;editIdx=-1;$('wAdd').textContent='إضافة الشباك'}else c.wins.push(w);
  $('ww').value=$('wh2').value='';$('wq').value=1;save();drawWins()};
$('toPdf').onclick=()=>{const c=cur();if(!c.wins.length){alert('أضف شباك واحد على الأقل');return}$('dv').value=c.dv||'';$('dt').value=c.dt;drawTot();go('pdf','ملفات PDF')};

/* totals and cuts */
function disc(c){const s=sumC(c),d=c.dt==='p'?s*c.dv/100:c.dv;return{s,d:Math.min(d,s),t:s-Math.min(d,s)}}
function drawTot(){const x=disc(cur());$('pt').textContent=`الإجمالي بعد الخصم: ${f1(x.t)}`}
$('dv').oninput=$('dt').onchange=()=>{const c=cur();c.dv=num($('dv').value);c.dt=$('dt').value;save();drawTot()};
function calc(w){const t=T[w.t],P=(D.prices.find(p=>p.n===w.s)||{}).par||DP,W=w.W,H=w.H,cuts=[['حلق أفقي',W,2],['حلق رأسي',H,2]],gl=[];
  if(t.k==='s'){const sh=H-P.a,sw=(W-P.b)/t.l+P.c;cuts.push(['ضلفة رأسي',sh,2*t.l],['ضلفة أفقي',sw,2*t.l]);gl.push([sw-P.g,sh-P.g,t.l])}
  else if(t.k==='c'){const sh=H-P.a2,sw=W/t.l-P.b2;cuts.push(['ضلفة رأسي',sh,2*t.l],['ضلفة أفقي',sw,2*t.l]);gl.push([sw-P.g,sh-P.g,t.l])}
  else gl.push([W-P.fg,H-P.fg,1]);
  const hw=t.k==='s'?[['عجل',2*t.l],['قفل',1]]:t.k==='c'?[['مفصلة',2*t.l],['يد',t.l]]:[];
  return{cuts,gl,hw}}
function bars(lens,cap){const b=[];[...lens].sort((x,y)=>y-x).forEach(l=>{const i=b.findIndex(r=>r+l<=cap);i<0?b.push(l):b[i]+=l});return b.length}

/* PDF */
const hdr=(c,t)=>`<h2>${t}</h2><div>العميل: <b>${esc(c.name)}</b> — ${new Date().toLocaleDateString('ar-EG')}</div>`;
const tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
function shop(c){
  const mat={},cutR=[],glR=[],asR=[],hwT={};let ga=0;
  c.wins.forEach((w,i)=>{const r=calc(w);r.cuts.forEach(([n,l,k])=>{cutR.push([i+1,T[w.t].n+' '+w.s,n,f1(l),k*w.q]);const key=w.s+' — '+n.split(' ')[0];(mat[key]=mat[key]||[]);for(let j=0;j<k*w.q;j++)mat[key].push(l)});
    r.gl.forEach(([a,b,k])=>{const q=k*w.q,m=a*b*q/10000;ga+=m;glR.push([i+1,esc(w.g),`${f1(a)}×${f1(b)}`,q,f1(m)])});
    r.hw.forEach(([n,k])=>hwT[n]=(hwT[n]||0)+k*w.q);asR.push([i+1,T[w.t].n,esc(w.s),w.q,r.hw.map(h=>h[0]+' '+h[1]*w.q).join('، ')||'—'])});
  const mr=Object.keys(mat).map(k=>[esc(k),f1(mat[k].reduce((a,b)=>a+b,0)/100),bars(mat[k],D.par.bar)]);
  return hdr(c,'ملف الورشة')+'<h4>الخامات</h4>'+tb(['القطاع','الأمتار','عدد الأعواد'],mr)+'<h4>الزجاج (إجمالي '+f1(ga)+' م²)</h4>'+tb(['شباك','النوع','المقاس سم','العدد','م²'],glR)+'<h4>التجميع</h4>'+tb(['شباك','النوع','النظام','العدد','الاكسسوار'],asR)+'<h4>قائمة التقطيع (سم)</h4>'+tb(['شباك','النوع','القطعة','الطول','العدد'],cutR)}
function quote(c){const x=disc(c);
  const rows=c.wins.map((w,i)=>{const p=wPrice(w);return[i+1,`${T[w.t].n} ${w.W}×${w.H} سم × ${w.q}`,esc(w.g),f1(p.area*w.q),f1(p.rate),f1(p.price)]});
  return hdr(c,'عرض سعر')+tb(['#','الشباك','الزجاج','المساحة م²','سعر المتر','السعر'],rows)+`<p>الإجمالي: ${f1(x.s)}</p>${x.d?`<p>الخصم: ${f1(x.d)}</p>`:''}<h2>المطلوب: ${f1(x.t)}</h2>`}
async function out(blob,name){const C=window.Capacitor,P=C&&C.Plugins;
  if(P&&P.Filesystem&&P.Share){const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
    const r=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:r.uri,dialogTitle:'حفظ / مشاركة'});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
async function mk(fn,name,btn){const c=cur(),b=$('pdfBox'),o=btn.textContent;btn.disabled=true;btn.textContent='جاري الإنشاء...';
  try{b.innerHTML=fn(c);const blob=await html2pdf().set({margin:6,image:{type:'jpeg',quality:.95},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}}).from(b).outputPdf('blob');await out(blob,`${name}-${c.name}.pdf`)}
  catch(e){alert('تعذر إنشاء الملف: '+e.message)}btn.disabled=false;btn.textContent=o}
$('pW').onclick=function(){mk(shop,'ورشة',this)};$('pQ').onclick=function(){mk(quote,'عرض-سعر',this)};

/* delegated events */
function draw(i){if(i==='prices')drawPrices();if(i==='client')drawClients();if(i==='win')drawWins();if(i==='pdf')drawTot()}
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.pn!==undefined){const p=D.prices[+d.pn],old=p.n;p.n=e.target.value;D.clients.forEach(c=>c.wins.forEach(w=>{if(w.s===old)w.s=p.n;if(w.g===old)w.g=p.n}));save()}
  else if(d.pv!==undefined){D.prices[+d.pv].v=num(e.target.value);save()}
  else if(d.sp){const[i,k]=d.sp.split('|');D.prices[+i].par[k]=num(e.target.value);save()}
  else if(d.bar!==undefined){D.par.bar=num(e.target.value)||600;save()}});
document.addEventListener('click',e=>{const d=e.target.dataset;if(!d)return;const c=cur();
  if(d.pd!==undefined){if(confirm('حذف هذا السعر؟')){D.prices.splice(+d.pd,1);save();drawPrices()}}
  else if(d.co){D.cur=+d.co;save();openWin()}
  else if(d.cr){const x=D.clients.find(c=>c.id===+d.cr),n=prompt('اسم العميل',x.name);if(n&&n.trim()){x.name=n.trim();save();drawClients()}}
  else if(d.cd){if(confirm('حذف العميل وكل شبابيكه؟')){D.clients=D.clients.filter(c=>c.id!==+d.cd);save();drawClients()}}
  else if(d.wx!==undefined){c.wins.splice(+d.wx,1);save();drawWins()}
  else if(d.wu!==undefined&&+d.wu>0){const i=+d.wu;[c.wins[i-1],c.wins[i]]=[c.wins[i],c.wins[i-1]];save();drawWins()}
  else if(d.wdn!==undefined&&+d.wdn<c.wins.length-1){const i=+d.wdn;[c.wins[i+1],c.wins[i]]=[c.wins[i],c.wins[i+1]];save();drawWins()}
  else if(d.we!==undefined){const w=c.wins[+d.we];$('wt').value=w.t;$('ws').value=w.s;$('wg').value=w.g;$('ww').value=w.W;$('wh2').value=w.H;$('wq').value=w.q;editIdx=+d.we;$('wAdd').textContent='حفظ التعديل'}});
</script>
